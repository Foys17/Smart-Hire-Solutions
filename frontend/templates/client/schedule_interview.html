{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-slate-50 py-12 px-4 flex justify-center items-center">
    <div class="max-w-xl w-full bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        
        <div class="bg-indigo-600 px-8 py-6">
            <h1 class="text-2xl font-bold text-white">Schedule Final Interview</h1>
            <p class="text-indigo-100 mt-1">Candidate: {{ app.candidate.full_name }}</p>
        </div>

        <div class="p-8">
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">{{ form.date.label }}</label>
                        {{ form.date }}
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">{{ form.time.label }}</label>
                        {{ form.time }}
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">{{ form.location.label }}</label>
                    {{ form.location }}
                    <p class="text-xs text-slate-500 mt-1">Provide a Google Meet link, Zoom link, or physical address.</p>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">{{ form.notes.label }}</label>
                    {{ form.notes }}
                </div>

                <div class="flex gap-3 pt-4">
                    <a href="{% url 'web_test:client_job_view' app.job.id %}" class="flex-1 py-3 text-center border border-slate-300 rounded-xl text-slate-600 font-bold hover:bg-slate-50 transition">
                        Cancel
                    </a>
                    <button type="submit" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5">
                        Confirm Schedule
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
